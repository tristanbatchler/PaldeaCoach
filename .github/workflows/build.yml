name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build PaldeaCoach -c Release
      - name: Smoke test (no save needed)
        run: |
          ./paldea help
          ./paldea dex tinkaton
